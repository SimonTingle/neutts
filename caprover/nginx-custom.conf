# ── NeuTTS CapRover custom Nginx directives ───────────────────────────────────
#
# Paste the block below into:
#   CapRover dashboard → Apps → neutts → HTTP Settings
#   → "Custom Nginx Configurations" → inside the server{} block
#
# ─────────────────────────────────────────────────────────────────────────────

    # TTS generation can take 60–120 s on a single CPU.
    proxy_read_timeout          180s;
    proxy_send_timeout          180s;
    proxy_connect_timeout       10s;

    # Allow audio file uploads up to 50 MB.
    client_max_body_size        50M;

    # Gradio uses WebSockets for streaming output — required.
    proxy_http_version          1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward real client IP (shows in Gradio logs).
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable response buffering so streaming audio reaches the browser
    # in real-time rather than being held until the full response is ready.
    proxy_buffering             off;
